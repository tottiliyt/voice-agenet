services:
  - type: web
    name: assort-health-voice-agent
    env: python
    plan: standard # This is a paid plan that won't spin down with inactivity
    buildCommand: pip install -r requirements.txt && python app.py download-files
    startCommand: python app.py start
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVEN_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SMARTY_AUTH_ID
        sync: false
      - key: SMARTY_AUTH_TOKEN
        sync: false
      - key: GMAIL_USERNAME
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
